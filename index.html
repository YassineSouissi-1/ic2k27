<title>Are you coming to IC 2K27?</title>

<style>
  body{margin:0;min-height:100vh;padding:20px 0;box-sizing:border-box;font-family:Fredoka,"Segoe UI",Arial,sans-serif;color:#14295F;overflow-x:hidden;
    background:#FFF4EC radial-gradient(#F6D9C9 1.2px,transparent 1.2px) 0 0/22px 22px;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:32px;padding:30px 34px 36px;max-width:420px;width:calc(100% - 40px);text-align:center;
    box-shadow:0 20px 60px rgba(20,41,95,.12);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;position:relative;z-index:1}
  .pic{width:220px;max-width:70%;max-height:38vh;object-fit:contain;border-radius:22px;display:block;margin:0 auto 18px}
  .float{animation:float 2.6s ease-in-out infinite;mix-blend-mode:multiply}
  .eyebrow{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#E9A92B;font-weight:600}
  h1{font-size:30px;line-height:1.15;font-weight:600;margin:8px 0 6px}
  .sub{font-size:16px;color:#5B6178;margin:6px 0 0;line-height:1.5}
  .btns{display:flex;gap:14px;justify-content:center;margin-top:26px}
  .btn{font:600 18px Fredoka,Arial,sans-serif;padding:14px 38px;border-radius:999px;cursor:pointer;text-decoration:none;border:0;transition:transform .25s,left .25s,top .25s;z-index:5}
  .yes{background:#14917A;color:#fff;box-shadow:0 8px 20px rgba(20,145,122,.35)}.yes:hover{transform:scale(1.06)}
  .no{background:#fff;color:#14295F;border:2px solid #E3DCEB}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:9}
  [hidden]{display:none!important}
  @keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
</style>

  <h1>Yaaay! See you in Tunisia! 🎉</h1>
  <p class="sub">We are so excited to have <span id="who">you</span> with us at IC 2K27.<br>Details are coming soon, keep an eye on your inbox.</p>
</div>

<script>
// Answers are saved by the Apps Script web app. The call is made without Google cookies,
// so people signed into several Google accounts never hit the "/u/5/" error.
var WEBAPP = "https://script.google.com/macros/s/AKfycbzpAULgwlBzoPlRkoqYx89xpJIj1T64ECVpobv4IthinW_RJFgOqrZsI-NL_g-demq4KQ/exec";
var q = new URLSearchParams(location.search), token = q.get("t") || "", entity = q.get("e") || "";
if (entity) {
  document.getElementById("hey").textContent = "Hey AIESEC in " + entity + " 👋";
  document.getElementById("hey").hidden = false;
  document.getElementById("who").textContent = "AIESEC in " + entity;
}

function save(v) {
  if (!token) return;
  var url = WEBAPP + "?t=" + encodeURIComponent(token) + "&a=rsvp&v=" + v;
  fetch(url, { mode: "no-cors", credentials: "omit", cache: "no-store" }).catch(function () {
    new Image().src = url; // fallback
  });
}

// "No" runs away
var no = document.getElementById("no"), yes = document.getElementById("yes"), n = 0;
var words = ["No", "Nope 🙈", "Are you sure?", "Not an option", "Nice try 😄", "Try the other one!"];
function run(ev) {
  if (ev && ev.cancelable) ev.preventDefault();
  n++;
  var r = no.getBoundingClientRect(), W = innerWidth - r.width - 16, H = innerHeight - r.height - 16, x, y, k = 0;
  do { x = 8 + Math.random() * W; y = 8 + Math.random() * H; k++; }
  while (k < 30 && Math.abs(x - r.left) < 140 && Math.abs(y - r.top) < 90);
  if (no.parentNode !== document.body) { // fixed must be relative to the window, not the animated card
    no.style.position = "fixed"; no.style.left = r.left + "px"; no.style.top = r.top + "px";
    document.body.appendChild(no); no.offsetWidth;
  }
  no.style.left = x + "px"; no.style.top = y + "px";
  no.textContent = words[n % words.length];
  yes.style.transform = "scale(" + Math.min(1 + n * 0.08, 1.6) + ")";
}
["mouseenter", "pointerdown", "touchstart", "focus", "click"].forEach(function (t) {
  no.addEventListener(t, run, { passive: false });
});

yes.addEventListener("click", function () {
  save("yes");
  document.getElementById("ask").hidden = true;
  no.hidden = true;
  document.getElementById("done").hidden = false;
  confetti();
});

function confetti() {
  var c = document.getElementById("fx"), x = c.getContext("2d"), P = [], t0 = Date.now();
  var cols = ["#1D3F9E", "#D13B3B", "#E9A92B", "#14917A", "#FF8FAB"];
  function size() { c.width = innerWidth; c.height = innerHeight; }
  size(); addEventListener("resize", size);
  for (var i = 0; i < 160; i++) P.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, v: 2 + Math.random() * 3, s: Math.random() * 6, r: Math.random() * 6, col: cols[i % cols.length] });
  (function tick() {
    x.clearRect(0, 0, c.width, c.height);
    var live = Date.now() - t0 < 6000;
    P.forEach(function (p) {
      p.y += p.v; p.r += 0.08; p.x += Math.sin(p.r + p.s);
      if (p.y > c.height + 20 && live) { p.y = -20; p.x = Math.random() * c.width; }
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    });
    if (live || P.some(function (p) { return p.y < c.height + 20; })) requestAnimationFrame(tick);
  })();
}
</script>
